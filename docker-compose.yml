version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sarthi_pay_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./sarthi_pay.db
      - ENABLE_FALLBACK_SIMULATION=True
    volumes:
      - ./backend/sarthi_pay.db:/app/sarthi_pay.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sarthi_pay_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

